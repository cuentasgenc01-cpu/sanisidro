<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#f4f7fb;display:flex}
.sidebar{width:250px;height:100vh;position:fixed;left:0;top:0;background:linear-gradient(180deg,#0D47A1,#1565C0,#1976D2);padding:20px 15px;color:white;display:flex;flex-direction:column}
.profile{text-align:center;margin-bottom:20px}
.profile img{width:100px;height:100px;border-radius:50%;border:4px solid rgba(255,255,255,.4);margin-bottom:10px}
.profile h2{font-size:18px}
.profile p{font-size:13px;opacity:.8}
.menu{flex:1}
.menu a{display:flex;gap:10px;color:white;text-decoration:none;padding:12px;border-radius:10px;margin-bottom:5px}
.menu a:hover{background:rgba(255,255,255,.15)}
#btnCerrarSesion{width:100%;padding:14px;border:none;border-radius:14px;background:#C62828;color:white;font-weight:bold;cursor:pointer}

.main{margin-left:250px;width:calc(100% - 250px);padding:40px}
.contenedor{max-width:1100px;background:white;padding:30px;border-radius:20px;box-shadow:0 10px 30px rgba(0,0,0,.1)}

/* ESTRUCTURA EN GRID */
#contenido.fila-descarga, #filaAsistencia.fila-descarga, #filaBoletin.fila-descarga {
    display: none; 
    align-items: center;
    gap: 15px;
    width: 100%;
}

/* 5 COLUMNAS PARA CONTENIDO (INCLUYE BOTÓN ANUAL) */
#contenido.fila-descarga {
    grid-template-columns: max-content 1fr 1fr max-content max-content;
}

/* 4 COLUMNAS PARA ASISTENCIA Y BOLETIN */
#filaAsistencia.fila-descarga, #filaBoletin.fila-descarga {
    grid-template-columns: max-content 1fr 1fr max-content;
}

/* Ajustes individuales */
.fila-descarga h1 {
    color: #0D47A1;
    margin-bottom: 0;
    font-size: 22px;
    white-space: nowrap; 
}

.estado{font-weight:bold;margin-bottom:20px}
.habilitado{color:green}.restringido{color:red}

select, button.descarga{padding:14px;border-radius:12px;height:48px; width: 100%;}
select { min-width: 180px; }
/* SOLUCIÓN AL DESBORDE: white-space: nowrap; y min-width dinámico para que no se salga del cuadro */
button.descarga{ border:none;background:#0D47A1;color:white; min-width: max-content; cursor: pointer; padding: 0 20px; white-space: nowrap;}
button.descarga:disabled{background:#999; cursor: not-allowed;}
button#btnDescargarAnual:not(:disabled) {
    background: #28a745;
}

button#btnDescargarAnual:not(:disabled):hover {
    background: #218838;
}

table tr:first-child th:nth-child(n+3),
table tr:first-child td:nth-child(n+3) {
    display: inline-block;
    white-space: nowrap;
    transform: rotate(-90deg);
    transform-origin: center center;
    vertical-align: middle;
}

.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);justify-content:center;align-items:center;z-index:9999}
.modal-content{width:560px;background:#ECE7F1;border-radius:30px;padding:25px;max-height: 90vh;display: flex;flex-direction: column;}
.titulo-modal{display:flex;justify-content:space-between;align-items:center;font-size:18px;font-weight:bold;color:#0D47A1;margin-bottom:20px}
#btnCerrarModal, #btnCerrarModalBoletin{cursor:pointer;font-size:24px}
.fila-campos{display:flex;gap:15px;align-items:end}
.campo{flex:1}
.campo label{display:block;margin-bottom:5px}
.campo input,.campo select{width:100%;height:42px;border-radius:12px;border:1px solid #ccc;padding:0 10px}
.acciones{display:flex;justify-content:flex-end;margin-top:20px}
#btnProcesar{border:none;background:#6F42C1;color:white;padding:14px 35px;border-radius:30px;font-size:20px;font-weight:bold;cursor:pointer}

.lista-est { list-style:none; padding:0; margin:0; }
.lista-est li { display:flex; justify-content:space-between; align-items:center; padding:12px 10px; border-bottom:1px solid #dcdcdc; background: white; border-radius: 8px; margin-bottom: 8px; }
.btn-pdf-est { background:#28a745; color:white; border:none; padding:8px 15px; border-radius:8px; cursor:pointer; font-weight:bold; transition: background 0.3s; }
.btn-pdf-est:hover { background:#218838; }
.btn-pdf-est:disabled { background:#999; cursor:not-allowed; }

/* SOLUCIÓN AL DESBORDE: Aumentamos el breakpoint a 1300px para que se adapte antes de romper el layout */
@media (max-width: 1300px) {
    #contenido.fila-descarga, #filaAsistencia.fila-descarga, #filaBoletin.fila-descarga {
        grid-template-columns: 1fr;
        justify-items: stretch;
    }
    .fila-descarga h1 { text-align: center; }
}
</style>

<script>
document.addEventListener("DOMContentLoaded", () => {
    const profesor = localStorage.getItem("profesor");

    // VALIDACIÓN DE SESIÓN (Redirigir a index si no hay profesor)
    if (!profesor) {
        window.location.href = "index.html";
        return;
    }

    document.getElementById("nombreProfesor").innerHTML = profesor || "Profesor";

    const tutorSelect = document.getElementById("TUTOR");
    
    // Variables agregadas para descarga de todo
    const btnDescargarTodoBoletines = document.getElementById("btnDescargarTodoBoletines");
    let estudiantesActualesParaBoletin = [];

    // --- CACHÉ GLOBAL DE PROFESORES PARA OPTIMIZAR DESCARGAS ---
    let cacheGlobalProfesores = null;
    async function obtenerProfesoresCache() {
        if (cacheGlobalProfesores) return cacheGlobalProfesores;
        try {
            const respProf = await fetch(`https://sanisidro-933a9-default-rtdb.firebaseio.com/PROFESORES.json`);
            cacheGlobalProfesores = await respProf.json();
            return cacheGlobalProfesores;
        } catch(e) {
            console.error("Error al obtener profesores", e);
            return null;
        }
    }

    async function cargarCursoTutor() {
        try {
            const url = `https://sanisidro-933a9-default-rtdb.firebaseio.com/PROFESORES/${encodeURIComponent(profesor)}/TUTORIA.json`;
            const response = await fetch(url);
            const tutoria = await response.json();

            tutorSelect.innerHTML = '<option value="">-- Seleccione Su Curso Tutor --</option>';

            if (!tutoria) return;

            Object.keys(tutoria).forEach(curso => {
                const option = document.createElement("option");
                option.value = curso;
                option.textContent = curso;
                tutorSelect.appendChild(option);
            });
        } catch (error) {
            console.error("Error cargando tutoría:", error);
        }
    }

    cargarCursoTutor();

    document.getElementById("btnCerrarSesion").addEventListener("click", function() {
        localStorage.removeItem("profesor");
        window.location.href = "index.html";
    });

    const modalAsistencia = document.getElementById("modalAsistencia");
    const cursoAsistencia = document.getElementById("cursoAsistencia");
    const fechaDesde = document.getElementById("fechaDesde");
    const fechaHasta = document.getElementById("fechaHasta");
    const btnProcesar = document.getElementById("btnProcesar");

    const modalBoletin = document.getElementById("modalBoletin");
    const cursoBoletin = document.getElementById("cursoBoletin");
    const btnCerrarModalBoletin = document.getElementById("btnCerrarModalBoletin");
    const listaEstudiantesBoletin = document.getElementById("listaEstudiantesBoletin");
    const loadingBoletin = document.getElementById("loadingBoletin");

    document.addEventListener("click", async (e) => {
        if (e.target && e.target.id === "btnAsistencia") {
            const hoy = new Date().toISOString().split("T")[0];
            fechaDesde.value = hoy;
            fechaHasta.value = hoy;

            modalAsistencia.style.display = "flex";
            cursoAsistencia.innerHTML = '<option value="">Seleccione Curso</option>';

            try {
                const url = `https://sanisidro-933a9-default-rtdb.firebaseio.com/PROFESORES/${encodeURIComponent(profesor)}/CURSO.json`;
                const response = await fetch(url);
                const cursos = await response.json();

                if (cursos) {
                    Object.keys(cursos).forEach(curso => {
                        const op = document.createElement("option");
                        op.value = curso;
                        op.textContent = curso;
                        cursoAsistencia.appendChild(op);
                    });
                }
            } catch (err) {
                console.error(err);
            }
        }

        if (e.target && e.target.id === "btnCerrarModal") {
            modalAsistencia.style.display = "none";
        }

        if (e.target && e.target.id === "btnBoletin") {
            modalBoletin.style.display = "flex";
            cursoBoletin.innerHTML = '<option value="">Seleccione Curso</option>';
            listaEstudiantesBoletin.innerHTML = '';
            btnDescargarTodoBoletines.style.display = "none";
            estudiantesActualesParaBoletin = [];

            try {
                const url = `https://sanisidro-933a9-default-rtdb.firebaseio.com/PROFESORES/${encodeURIComponent(profesor)}/CURSO.json`;
                const response = await fetch(url);
                const cursos = await response.json();

                if (cursos) {
                    Object.keys(cursos).forEach(curso => {
                        const op = document.createElement("option");
                        op.value = curso;
                        op.textContent = curso;
                        cursoBoletin.appendChild(op);
                    });
                }
            } catch (err) {
                console.error(err);
            }
        }

        if (e.target && e.target.id === "btnCerrarModalBoletin") {
            modalBoletin.style.display = "none";
        }

        if (e.target && e.target.classList.contains("btn-pdf-est")) {
            const estudianteSeleccionado = e.target.getAttribute("data-estudiante");
            const numLista = e.target.getAttribute("data-numero");
            const cursoSelecc = cursoBoletin.value;
            if (cursoSelecc && estudianteSeleccionado) {
                generarPDFLibreta(cursoSelecc, estudianteSeleccionado, e.target, numLista);
            }
        }
    });

    cursoBoletin.addEventListener("change", async () => {
        const cursoSeleccionado = cursoBoletin.value;
        listaEstudiantesBoletin.innerHTML = "";
        btnDescargarTodoBoletines.style.display = "none";
        estudiantesActualesParaBoletin = [];
        
        if (!cursoSeleccionado) return;

        loadingBoletin.style.display = "block";

        try {
            const respEst = await fetch(`https://sanisidro-933a9-default-rtdb.firebaseio.com/CURSOS/${encodeURIComponent(cursoSeleccionado)}.json`);
            const estudiantesData = await respEst.json();

            if (!estudiantesData || Object.keys(estudiantesData).length === 0) {
                listaEstudiantesBoletin.innerHTML = "<li style='justify-content:center;color:red;'>No hay estudiantes en este curso.</li>";
                loadingBoletin.style.display = "none";
                return;
            }

            const listaEstudiantes = [];
            if (Array.isArray(estudiantesData)) {
                estudiantesData.forEach((val, index) => {
                    if (val) listaEstudiantes.push(String(val).includes(":") ? String(val) : `${index}:${val}`);
                });
            } else {
                for (const key in estudiantesData) {
                    const val = estudiantesData[key];
                    if (key.includes(":")) listaEstudiantes.push(key);
                    else listaEstudiantes.push(`${key}:${val}`);
                }
            }

            const estudiantesOrdenados = listaEstudiantes.sort((a, b) => {
                const numA = parseInt(a.split(":")[0]) || 9999;
                const numB = parseInt(b.split(":")[0]) || 9999;
                return numA - numB;
            });

            estudiantesActualesParaBoletin = estudiantesOrdenados.map((estItem, index) => {
                const partes = estItem.split(":");
                const nombreEstudiante = (partes.length >= 2 ? partes[1] : estItem).trim().toUpperCase();
                return { nombre: nombreEstudiante, numero: index + 1 };
            });

            estudiantesActualesParaBoletin.forEach((est) => {
                const li = document.createElement("li");
                li.innerHTML = `
                    <span style="font-size: 14px; width: 70%;"><b>${est.numero}.</b> ${est.nombre}</span>
                    <button class="btn-pdf-est" data-estudiante="${est.nombre}" data-numero="${est.numero}">📄 Descargar Libreta</button>
                `;
                listaEstudiantesBoletin.appendChild(li);
            });

            btnDescargarTodoBoletines.style.display = "block"; 

        } catch (error) {
            console.error(error);
            listaEstudiantesBoletin.innerHTML = "<li style='justify-content:center;color:red;'>Error al cargar la lista de estudiantes.</li>";
        } finally {
            loadingBoletin.style.display = "none";
        }
    });

    btnDescargarTodoBoletines.addEventListener("click", async () => {
        const cursoSeleccionado = cursoBoletin.value;
        if (cursoSeleccionado && estudiantesActualesParaBoletin.length > 0) {
            generarPDFLibretaTodos(cursoSeleccionado, estudiantesActualesParaBoletin, btnDescargarTodoBoletines);
        }
    });

    btnProcesar.addEventListener("click", async () => {
        try {
            const cursoSeleccionado = cursoAsistencia.value;
            const desde = fechaDesde.value;
            const hasta = fechaHasta.value;

            if (!cursoSeleccionado) {
                alert("Seleccione un curso");
                return;
            }
            if (!desde || !hasta) {
                alert("Seleccione ambas fechas");
                return;
            }

            // OPTIMIZADO: Descargas concurrentes en paralelo
            const estudiantesUrl = `https://sanisidro-933a9-default-rtdb.firebaseio.com/CURSOS/${encodeURIComponent(cursoSeleccionado)}.json`;
            const historialUrl = `https://sanisidro-933a9-default-rtdb.firebaseio.com/HISTORIAL_CAMBIOS/${encodeURIComponent(cursoSeleccionado)}.json`;
            const materiaUrl = `https://sanisidro-933a9-default-rtdb.firebaseio.com/PROFESORES/${encodeURIComponent(profesor)}/CURSO/${encodeURIComponent(cursoSeleccionado)}.json`;

            const [estudiantes, historial, materiaResult] = await Promise.all([
                fetch(estudiantesUrl).then(r => r.json()),
                fetch(historialUrl).then(r => r.json()),
                fetch(materiaUrl).then(r => r.json()).catch(() => "")
            ]);

            if (!estudiantes || Object.keys(estudiantes).length === 0) {
                alert("No hay estudiantes en este curso");
                return;
            }

            const fechasSet = new Set();
            for (const idRegistro in historial) {
                const registro = historial[idRegistro];
                const profesorRegistro = String(registro.profesor || "").trim();
                if (profesorRegistro !== profesor) continue;
                const fechaRegistro = convertirFecha(registro.fecha_asis || "");
                if (fechaRegistro >= desde && fechaRegistro <= hasta) {
                    fechasSet.add(fechaRegistro);
                }
            }

            const fechas = [...fechasSet].sort();
            const datos = [];
            datos.push(["N°", "ESTUDIANTE", ...fechas]);

            let contador = 1;
            const estudiantesOrdenados = Object.keys(estudiantes).sort((a, b) => Number(a) - Number(b));

            for (const idEstudiante of estudiantesOrdenados) {
                const nombreEstudiante = (estudiantes[idEstudiante] || "").trim();
                if (!nombreEstudiante) continue;
                const fila = [contador, nombreEstudiante];

                for (const fecha of fechas) {
                    let estado = "A";
                    for (const idRegistro in historial) {
                        const registro = historial[idRegistro];
                        const profesorRegistro = String(registro.profesor || "").trim();
                        if (profesorRegistro !== profesor) continue;
                        const fechaRegistro = convertirFecha(registro.fecha_asis || "");
                        if (fechaRegistro !== fecha) continue;

                        const cambios = registro.cambios || {};
                        if (Object.prototype.hasOwnProperty.call(cambios, nombreEstudiante)) {
                            const valorOriginal = String(cambios[nombreEstudiante] || "").trim().toUpperCase();
                            let estadoFinal = valorOriginal;
                            if (valorOriginal.includes(" A ")) {
                                estadoFinal = valorOriginal.split(" A ").pop().trim();
                            }
                            if (["A", "F", "FA", "L"].includes(estadoFinal)) {
                                estado = estadoFinal;
                            }
                            break;
                        }
                    }
                    fila.push(estado);
                }
                datos.push(fila);
                contador++;
            }

            const columnas = [
                { header: "N°", dataKey: "numero" },
                { header: "ESTUDIANTE", dataKey: "estudiante" },
                ...fechas.map((fecha, index) => ({
                    header: fecha.split("-").reverse().slice(0,2).join("/"),
                    dataKey: `d${index}`
                })),
                { header: "TOTAL F", dataKey: "totalF" }
            ];

            const filasPdf = datos.slice(1).map((fila) => {
                const filaObjeto = { numero: fila[0], estudiante: fila[1] };
                let totalF = 0;
                for (let i = 0; i < fechas.length; i++) {
                    const valor = fila[2 + i];
                    filaObjeto[`d${i}`] = valor;
                    if (valor === "F") totalF++;
                }
                filaObjeto.totalF = totalF;
                return filaObjeto;
            });

            const materia = typeof materiaResult === "string" ? materiaResult : "";

            const doc = new window.jspdf.jsPDF({
                orientation: "portrait",
                unit: "mm",

                columnStyles: { 0: {cellWidth: 8}, 1: { cellWidth: 45, overflow: "ellipsize" } },
                didParseCell: function(data) {
                    if (data.section === "head" && data.column.index >= 2) {
                        data.cell.styles.minCellHeight = 14;
                        data.cell.text = [];
                    }
                    if (data.section !== "body") return;
                    const valor = String(data.cell.raw || "").trim().toUpperCase();
                    if (valor === "F") {
                        data.cell.styles.fillColor = [255,199,206];
                        data.cell.styles.textColor = [156,0,6];
                        data.cell.styles.fontStyle = "bold";
                    }
                    if (valor === "FA") {
                        data.cell.styles.fillColor = [189,215,238];
                        data.cell.styles.textColor = [0,70,140];
                        data.cell.styles.fontStyle = "bold";
                    }
                    if (valor === "L") {
                        data.cell.styles.fillColor = [198,239,206];
                        data.cell.styles.textColor = [0,97,0];
                        data.cell.styles.fontStyle = "bold";
                    }
                },
                didDrawCell: function(data) {
                    if (data.section === "head" && data.column.index >= 2) {
                        const texto = String(data.cell.raw);
                        doc.saveGraphicsState();
                        doc.text( texto, data.cell.x + (data.cell.width / 2), data.cell.y + data.cell.height - 1, { angle: 90 });
                        doc.restoreGraphicsState();
                    }
                },
                didDrawPage: function() {

                showHead: "everyPage",

            });

            doc.save(`${cursoSeleccionado}_Asistencia_${desde}_${hasta}.pdf`);
            alert("PDF descargado correctamente");
            modalAsistencia.style.display = "none";
        } catch (ex) {

    function convertirFecha(fechaBoliviana) {
        if (!fechaBoliviana) return "";
        const partes = fechaBoliviana.split("-");
        if (partes.length !== 3) return "";
        const dia = partes[0].padStart(2, "0");
        const mes = partes[1].padStart(2, "0");
        const anio = partes[2];
        return `${anio}-${mes}-${dia}`;
    }

    function calcPromedioInterno(notaRoot, key) {
        const nodo = notaRoot[key];
        if (nodo === undefined || nodo === null) return null;
        if (typeof nodo === 'number') return nodo;
        if (typeof nodo === 'string') {
            const v = parseFloat(nodo);
            return isNaN(v) ? null : v;
        }
        if (typeof nodo === 'object') {
            let s = 0, c = 0;
            for (const k in nodo) {
                const val = parseFloat(nodo[k]);
                if (!isNaN(val)) { s += val; c++; }
            }
            return c > 0 ? (s / c) : null;
        }
        return null;
    }

    function calcSumaInterna(notaRoot, key) {
        const nodo = notaRoot[key];
        if (nodo === undefined || nodo === null) return null;
        if (typeof nodo === 'number') return nodo;
        if (typeof nodo === 'string') {
            const v = parseFloat(nodo);
            return isNaN(v) ? null : v;
        }
        if (typeof nodo === 'object') {
            let s = 0, ex = false;
            for (const k in nodo) {
                const val = parseFloat(nodo[k]);
                if (!isNaN(val)) { s += val; ex = true; }
            }
            return ex ? s : null;
        }
        return null;
    }

                for (const nomProf in todosProfes) {
                    const profUpp = String(nomProf).toUpperCase();
                    if (profUpp.includes("REGENTA") || profUpp.includes("DIRECTOR")) continue;

                    const pData = todosProfes[nomProf];
                    if (pData.CURSO && pData.CURSO[curso]) {
                        const materia = pData.CURSO[curso];
                        const matUpp = String(materia).toUpperCase();
                        if (!matUpp.includes("REGENTA") && !matUpp.includes("DIRECTOR")) {
                            profesoresCurso.push({ nombre: nomProf, materia: materia });
                        }
                    }
                }
            }

            if (profesoresCurso.length === 0) {
                alert("No se encontraron profesores asignados a este curso para generar el boletín.");
                btnElement.innerText = "📄 Descargar Libreta";

            }

                                        const aut = calcSumaInterna(notaRoot, "AUTOEVALUACION");
                                        if (ser !== null && sab !== null && hac !== null && aut !== null) {
                                            const ext = calcSumaInterna(notaRoot, "NOTAS_EXTRAS") || 0;
                                            notaFinal = ser + sab + hac + aut + ext;
                                        }
                                    }
                                }
                            }

                            if (notaFinal !== null && notaFinal > 0) {
                                const valorRedondeado = Math.round(notaFinal);
                                cellNota.value = valorRedondeado;
                                if (valorRedondeado < 30) {
                                    cellNota.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF9370DB' } };
                                    cellNota.font = { bold: true, color: { argb: 'FFFFFFFF' } };
                                } else if (valorRedondeado < 51) {
                                    cellNota.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFFF0000' } };
                                    cellNota.font = { bold: true, color: { argb: 'FFFFFFFF' } };
                                }
                                sumaAnualMateria += valorRedondeado;
                                trimestresValidos++;
                            } else {
                                tieneNotasCompletasMateria = false;
                            }
                        }
                    });

                    const cellA = ws.getCell(fila, colNotas + 3);
                    cellA.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFF5F5F5' } };

                    if (tieneNotasCompletasMateria && trimestresValidos === trimestresActivos.length) {
                        const notaA = Math.round(sumaAnualMateria / trimestresValidos); 
                        cellA.value = notaA;
                        cellA.font = { bold: true };
                        if (notaA < 51) { cellA.font = { bold: true, color: { argb: 'FFFF0000' } }; }
                        sumaAnualGeneral += notaA;
                        materiasValidasGeneral++;
                    } else {
                        cellA.value = "";
                        promedioCompleto = false; 
                    }
                    colNotas += 4; 
                });

                const cellProm = ws.getCell(fila, colPromedio);
                // PARTE ARREGLADA (Había un corte en el archivo original del usuario aquí)
                if (promedioCompleto && materiasValidasGeneral === profesoresCurso.length && materiasValidasGeneral > 0) {
                    const promGral = Math.round((sumaAnualGeneral / materiasValidasGeneral) * 100) / 100;
                    cellProm.value = promGral;
                    cellProm.font = { bold: true };
                    
                    if (promGral < 51) {
                        cellProm.font = { bold: true, color: { argb: 'FFFF0000' } };
                    }
                    listaCeldasPromedio.push({ cell: cellProm, value: promGral });
                } else {
                    cellProm.value = "";
                    const cellNombre = ws.getCell(fila, 2);
                    cellNombre.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFFFFF00' } };
                }
                fila++;
                numero++;
            }

            listaCeldasPromedio.sort((a, b) => b.value - a.value);
            const mejores3 = listaCeldasPromedio.slice(0, 3);
            mejores3.forEach(item => {
                item.cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF0000FF' } };
                item.cell.font = { bold: true, color: { argb: 'FFFFFFFF' } };
            });

            const borderOpts = { style: 'thin', color: { argb: 'FF000000' } };
            for (let r = 3; r < fila; r++) {
                for (let c = 1; c <= colPromedio; c++) {
                    const celdaFinal = ws.getCell(r, c);
                    celdaFinal.border = { top: borderOpts, left: borderOpts, bottom: borderOpts, right: borderOpts };
                    if (c > 2 && r > 5) celdaFinal.alignment = { horizontal: 'center', vertical: 'middle' };
                }
            }

            ws.getColumn(1).width = 6;
            ws.getColumn(2).width = 35;

            const buffer = await wb.xlsx.writeBuffer();
            const nombreArchivo = `ANUAL_${cursoSeleccionado}.xlsx`;
            saveAs(new Blob([buffer]), nombreArchivo);
            
            alert("Excel Anual generado correctamente.");

        } catch (ex) {
            console.error(ex);
            alert("Error al exportar a Excel: " + ex.message);
        } finally {
            btnDescargarAnual.innerText = "⬇ Descargar Anual";
            btnDescargarAnual.disabled = false;
        }
    });
});
</script>
</body>
</html>
