.profile{

.menu a:hover{

        /* CAMBIO A BURBUJA FLOTANTE PARA EL BOTON GUARDAR - AHORA CENTRADO */
        #btnGuardar {
    position: fixed;
    bottom: 30px;
    left: 250px;
    right: 0;
    margin: 0 auto;

    width: 85px;
    height: 85px;
    border-radius: 50%;

    background: linear-gradient(135deg, #4CAF50, #070beb);
    color: white;

    border: 3px solid rgba(255,255,255,.3);

    box-shadow:
        0 10px 25px rgba(46,125,50,.5),
        0 5px 10px rgba(0,0,0,.2);

    z-index:1000;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    gap:3px;

    padding:0;

    cursor:pointer;

    transition:all .3s cubic-bezier(.175,.885,.32,1.275);
}

#btnGuardar span:first-child{
    font-size:20px;
    line-height:1;
}

#btnGuardar span:last-child{
    font-size:11px;
    font-weight:900;
    line-height:1;
    letter-spacing:.5px;
}

        #btnGuardar:hover:not(:disabled) {
            background: linear-gradient(135deg, #43A047, #1B5E20);
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 15px 35px rgba(46, 125, 50, 0.6), 0 8px 15px rgba(0,0,0,0.3);
            border-color: rgba(255, 255, 255, 0.6);

        #btnGuardar:disabled {
            background: linear-gradient(135deg, #e0e0e0, #9e9e9e);

        .filter-chip {

        .loading {
            display: none;

            top: 0;
            left: 0;

        .spinner {
            border: 5px solid #f3f3f3;
            border-top: 5px solid #0D47A1;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

            color: white;
            margin-top: 20px;
            font-size: 18px;

    let estados = {};
    let alumnos = [];
    let cursoActual = "";
    const hoy = new Date();
    let fechaActual = hoy.getFullYear() + '-' + String(hoy.getMonth() + 1).padStart(2, '0') + '-' + String(hoy.getDate()).padStart(2, '0');
    let fechaElegida = fechaActual;
    let textoWhatsApp = ""; // VARIABLE PARA ALMACENAR TEXTO DEL HISTORIAL

    // Variables para el historial del alumno
    let alumnoActualHist = "";
    let registrosCompletosHist = [];
    let filtroEstadoHist = null;
    document.getElementById("histFechaInicio").value = fechaActual;
    document.getElementById("histFechaFin").value = fechaActual;

    // Formatear fecha para que coincida con Firebase (D-M-YYYY)
    function formatFechaDB(fechaISO) {
        if (!fechaISO) return "";
        const [y, m, d] = fechaISO.split('-');
        return `${parseInt(d)}-${parseInt(m)}-${y}`;
    }

    // INICIALIZAR
document.getElementById(
    "nombreProfesorSidebar"
).textContent =
    profesor || "Invitado";

document.getElementById(
    "fecha"
).value = fechaActual;
    
    // Verificar si es fecha actual al cambiar
    function actualizarEstadoBotones() {
        const esHoy = fechaElegida === fechaActual;
        document.getElementById("btnGuardar").disabled = !cursoActual || !esHoy;
        document.getElementById("btnActualizar").disabled = !cursoActual || !esHoy;
    }

    // CARGAR CURSOS DEL PROFESOR
    async function cargarCursos() {
        if (!profesor) return;
        const snapshot = await get(ref(db, `PROFESORES/${profesor}/CURSO`));
        const select = document.getElementById("curso");
        select.innerHTML = '<option value="">Seleccionar Curso</option>';
        
        if (snapshot.exists()) {
            Object.keys(snapshot.val()).forEach(curso => {
                const option = document.createElement("option");
                option.value = curso;
                option.textContent = curso;
                select.appendChild(option);
            });
        }
    }

    window.cursoSeleccionado = async function() {

    const selectCurso = document.getElementById("curso");

    if (selectCurso.options[0] && selectCurso.options[0].value === "") {
        selectCurso.remove(0);
    }

    cursoActual = document.getElementById("curso").value;
    document.getElementById("fecha").disabled = !cursoActual;

    if (!cursoActual) {
    document.getElementById("statsContainer").style.display = "none";
    return;
}

document.getElementById("statsContainer").style.display = "grid";

document.getElementById("btnHistorial").disabled = false;
actualizarEstadoBotones();

cargarAlumnos();
cargarEstados();
}

    window.fechaSeleccionada = function() {
        fechaElegida = document.getElementById("fecha").value;
        actualizarEstadoBotones();
        
        // Recargar alumnos y estados cuando cambia la fecha
        if (cursoActual) {
            cargarEstados();
        }
    }

    async function cargarAlumnos() {
        if (!cursoActual) return;
        const snapshot = await get(ref(db, `CURSOS/${cursoActual}`));
        alumnos = [];
        
        if (snapshot.exists()) {
            snapshot.forEach(child => {
                alumnos.push(child.val());
            });
            alumnos.sort();
        }
        
        mostrarAlumnos();
    }

    async function cargarEstados() {
        if (!cursoActual || !fechaElegida) return;
        const fechaDB = formatFechaDB(fechaElegida);
        const snapshot = await get(ref(db, `asistencia/${fechaDB}/${cursoActual}`));
        estados = {};
        
        if (snapshot.exists()) {
            snapshot.forEach(child => {
                estados[child.key] = child.val();
            });
        }
        
        // Inicializar con "A" si no existen
        alumnos.forEach(alumno => {
            if (!estados[alumno]) {
                estados[alumno] = "A";
            }
        });
        
        mostrarAlumnos();
    }

    window.actualizarDatos = async function() {
        if (!cursoActual || !fechaElegida) return;
        document.getElementById("loading").classList.add("active");
        document.getElementById("loadingText").textContent = "Actualizando datos...";
        try {
            await cargarAlumnos();
            await cargarEstados();
        } finally {
            document.getElementById("loading").classList.remove("active");
        }
    }

    function mostrarAlumnos() {
        const container = document.getElementById("alumnosList");
        container.innerHTML = "";
        
        if (alumnos.length === 0) {
            container.innerHTML = '<div style="padding: 20px; text-align: center; color: #999;">No hay alumnos en este curso</div>';
            return;
        }
        
        alumnos.forEach((alumno, index) => {
            const estado = estados[alumno] || "A";
            const item = document.createElement("div");
            item.className = `list-item ${getClasePorEstado(estado)}`;
            
            const labelEstado = {
                "A": "✓ ASISTENTE",
                "F": "✗ FALTA",
                "FA": "⏱ ATRA",
                "L": "📜 LICENCIA"
            }[estado] || estado;
            
            const colorEstado = {
                "A": "#4CAF50",
                "F": "#d32f2f",
                "FA": "#00bcd4",
                "L": "#558b2f"
            }[estado] || "#333";
            
            item.innerHTML = `
                <span class="item-number">${index + 1}.</span>
                <span class="item-name">${alumno}</span>
                <span class="item-status status-${estado.toLowerCase()}" style="background: ${colorEstado};">${labelEstado}</span>
            `;
            
            item.onclick = () => cambiarEstado(alumno);
            item.oncontextmenu = (e) => {
                e.preventDefault();
                verHistorialAlumno(alumno);
            };
            
            container.appendChild(item);
        });
        
        actualizarEstadisticas();
    }

    function getClasePorEstado(estado) {
        switch(estado) {
            case "F": return "falta";
            case "FA": return "atraso";
            case "L": return "licencia";
            default: return "asistente";
        }
    }

    function cambiarEstado(alumno) {
        let estado = estados[alumno] || "A";

        const transiciones = {
            "A": "F",
            "F": "FA",
            "FA": "L",
            "L": "A"
        };

        estado = transiciones[estado] || "A";
        estados[alumno] = estado;
        mostrarAlumnos();
    }

    function actualizarEstadisticas() {
        const total = alumnos.length;
        const asistentes = alumnos.filter(a => (estados[a] || "A") === "A").length;
        const atrasos = alumnos.filter(a => (estados[a] || "A") === "FA").length;
        const faltas = alumnos.filter(a => (estados[a] || "A") === "F").length;
        const licencias = alumnos.filter(a => (estados[a] || "A") === "L").length;
        
        document.getElementById("stat-total").textContent = total;
        document.getElementById("stat-asistentes").textContent = asistentes;
        document.getElementById("stat-atrasos").textContent = atrasos;
        document.getElementById("stat-faltas").textContent = faltas;
        document.getElementById("stat-licencias").textContent = licencias;
    }

    window.filtrarEstado = function(estado) {
        if (!cursoActual || alumnos.length === 0) return;

        const titulos = {
            'TOTAL': 'LISTA TOTAL',
            'A': 'LISTA DE ASISTENTES',
            'F': 'LISTA DE FALTAS',
            'FA': 'LISTA DE ATRASOS',
            'L': 'LISTA DE LICENCIAS'
        };

        const filtrados = alumnos.filter(a => {
            const est = estados[a] || "A";
            return estado === 'TOTAL' || est === estado;
        });

        const titulo = document.getElementById("tituloListaEstado");
        const container = document.getElementById("contenidoListaEstado");

        titulo.textContent = `${titulos[estado] || 'LISTA'} (${filtrados.length})`;
        container.innerHTML = "";

        if (filtrados.length === 0) {
            container.innerHTML = '<div style="text-align:center; padding:20px; color:gray;">No hay estudiantes con este estado.</div>';
        } else {
            filtrados.forEach((nombre, idx) => {
                const div = document.createElement("div");
                div.style.padding = "12px 10px";
                div.style.borderBottom = "1px solid #eee";
                div.innerHTML = `<span style="color:#999; font-weight:bold; margin-right:10px;">${idx + 1}.</span> ${nombre}`;
                container.appendChild(div);
            });
        }

        document.getElementById("modalListaPorEstado").classList.add("active");
    };

    window.guardarAsistencia = async function() {
        if (!cursoActual || !fechaElegida) return;
        
        // Validar que sea la fecha actual
        if (fechaElegida !== fechaActual) {
            alert("Solo puedes guardar la asistencia del día actual");
            return;
        }
        
        document.getElementById("loading").classList.add("active");
        document.getElementById("loadingText").textContent = "Guardando asistencia...";
        
        try {
            const updates = {};
            const fechaDB = formatFechaDB(fechaElegida);
            
            // Guardar estados en asistencia
            Object.keys(estados).forEach(alumno => {
                updates[`asistencia/${fechaDB}/${cursoActual}/${alumno}`] = estados[alumno];
            });
            
            // Guardar en historial de cambios
            const ahora = new Date().toLocaleString("es-ES");
            const cambios = {};
            
            Object.keys(estados).forEach(alumno => {
                if (estados[alumno] !== "A") {
                    cambios[alumno] = estados[alumno];
                }
            });
            
            const historialRef = ref(db, `HISTORIAL_CAMBIOS/${cursoActual}`);
            const historialSnapshot = await get(historialRef);
            
            let existente = null;
            if (historialSnapshot.exists()) {
                historialSnapshot.forEach(child => {
                    if (child.val().profesor === profesor && child.val().fecha_asis === fechaDB) {
                        existente = child.key;
                    }
                });
            }
            
            const registroHistorial = {
                profesor: profesor,
                fecha_asis: fechaDB,
                fecha_hora_reg: ahora,
                cambios: cambios
            };
            
            if (existente) {
                updates[`HISTORIAL_CAMBIOS/${cursoActual}/${existente}`] = registroHistorial;
            } else {
                // Para push, hacemos un update separado
                const newKey = push(historialRef).key;
                updates[`HISTORIAL_CAMBIOS/${cursoActual}/${newKey}`] = registroHistorial;
            }
            
            await update(ref(db), updates);
            
            alert("¡Asistencia guardada correctamente!");
        } catch (error) {
            console.error("Error:", error);
            alert("Error al guardar: " + error.message);
        } finally {
            document.getElementById("loading").classList.remove("active");
        }
    }

    window.verHistorial = async function() {
        if (!cursoActual || !fechaElegida) return;
        const fechaDB = formatFechaDB(fechaElegida);
        
        document.getElementById("loading").classList.add("active");
        document.getElementById("loadingText").textContent = "Cargando historial...";
        
        try {
            const snapshot = await get(ref(db, `HISTORIAL_CAMBIOS/${cursoActual}`));
            
            const container = document.getElementById("historialContenido");
            container.innerHTML = "";
            
            document.getElementById("historialFecha").textContent = `Cambios del día: ${fechaDB}`;
            
            // SE AÑADE LÓGICA PARA RECOPILAR DATOS PARA WHATSAPP
            textoWhatsApp = "";
            let tieneCambios = false;
            let mensajeWPP = `📋 *REPORTE DE ASISTENCIA*\n *Curso:* ${cursoActual}\n *Fecha:* ${fechaDB}\n`;
            
            if (snapshot.exists()) {
                snapshot.forEach(child => {
                    const data = child.val();
                    if (data.fecha_asis !== fechaDB) return; // Filtro manual

                    tieneCambios = true;
                    const card = document.createElement("div");
                    card.style.cssText = "background: #f9f9f9; padding: 10px; margin-bottom: 10px; border-radius: 5px; border-left: 4px solid #0D47A1;";
                    
                    let cambiosHTML = `<strong>Prof: ${data.profesor}</strong><br>`;
                    cambiosHTML += `<small>${data.fecha_hora_reg}</small><br><br>`;
                    
                   mensajeWPP += `\n_Prof: ${data.profesor} ${data.fecha_hora_reg}_\n`;

                   if (data.cambios) {
    let contador = 1;

    Object.keys(data.cambios).forEach(alumno => {
        let estado = data.cambios[alumno];
        let estadoDisplay = estado === "FA" ? "ATRA" : estado;
        cambiosHTML += `<div>${contador}. <strong>${alumno}:</strong> ${estadoDisplay}</div>`;

       let estadoFinal = estado.includes(" a ")
    ? estado.split(" a ").pop().trim()
    : estado;

let wppEstado =
    estadoFinal === "FA" ? "ATRASO" :
    estadoFinal === "F"  ? "FALTA" :
    estadoFinal === "L"  ? "LICENCIA" :
    estadoFinal;

        mensajeWPP += ` ${contador}. *${alumno}:* ${wppEstado}\n`;

        contador++;
    });
}
                    
                    card.innerHTML = cambiosHTML;
                    container.appendChild(card);
                });
            }
            
            if (tieneCambios) {
                textoWhatsApp = mensajeWPP;
            } else {
                container.innerHTML = '<div style="text-align:center; padding:20px; color:gray;">No hay registros de cambios para esta fecha.</div>';
                textoWhatsApp = "";
            }
            
            document.getElementById("historialModal").classList.add("active");
        } catch (error) {
            console.error("Error:", error);
            alert("Error al cargar historial: " + error.message);
        } finally {
            document.getElementById("loading").classList.remove("active");
        }
    }

    // NUEVA FUNCIÓN PARA COMPARTIR POR WHATSAPP
    window.compartirWhatsApp = function() {
        if (!textoWhatsApp || textoWhatsApp.trim() === "") {
            alert("NO EXISTE CAMBIOS PARA COMPARTIR");
            document.getElementById('historialModal').classList.remove('active');
            return;
        }
        
        // Codifica el texto y abre WhatsApp
        const url = `https://wa.me/?text=${encodeURIComponent(textoWhatsApp)}`;
        window.open(url, '_blank');
    }

    window.toggleFiltroEstado = function(estado) {
        filtroEstadoHist = (filtroEstadoHist === estado) ? null : estado;
        
        // Actualizar UI de los chips
        document.getElementById("chipF").style.borderWidth = (filtroEstadoHist === 'F') ? "3px" : "1px";
        document.getElementById("chipFA").style.borderWidth = (filtroEstadoHist === 'FA') ? "3px" : "1px";
        document.getElementById("chipL").style.borderWidth = (filtroEstadoHist === 'L') ? "3px" : "1px";
        
        renderizarHistorialAlumno();
    }

    window.verHistorialAlumno = async function(alumno) {
        alumnoActualHist = alumno;
        document.getElementById("histAlumnoTitulo").textContent = `HISTORIAL: ${alumno}`;
        document.getElementById("historialAlumnoContenido").innerHTML = "";
        document.getElementById("countF").textContent = "0";
        document.getElementById("countFA").textContent = "0";
        document.getElementById("countL").textContent = "0";
        filtroEstadoHist = null;
        
        document.getElementById("modalHistorialAlumno").classList.add("active");
    }

    window.buscarHistorialAlumno = async function() {
        if (!cursoActual || !alumnoActualHist) return;
        
        document.getElementById("loading").classList.add("active");
        document.getElementById("loadingText").textContent = "Buscando historial...";
        
        // Parsear fechas de los inputs (YYYY-MM-DD) a objetos Date locales para comparar correctamente
        const [yI, mI, dI] = document.getElementById("histFechaInicio").value.split('-').map(Number);
        const [yF, mF, dF] = document.getElementById("histFechaFin").value.split('-').map(Number);
        
        const fIni = new Date(yI, mI - 1, dI);
        const fFin = new Date(yF, mF - 1, dF);
        
        try {
            const snapshot = await get(ref(db, `HISTORIAL_CAMBIOS/${cursoActual}`));
            registrosCompletosHist = [];
            const profesoresSet = new Set();

            if (snapshot.exists()) {
                snapshot.forEach(child => {
                    const data = child.val();
                    // Parsear fecha D-M-YYYY a objeto Date para comparar
                    const parts = data.fecha_asis.split('-');
                    const fechaAsis = new Date(parts[2], parts[1] - 1, parts[0]);

                    if (fechaAsis >= fIni && fechaAsis <= fFin) {
                        if (data.cambios && data.cambios[alumnoActualHist]) {
                            const cambio = data.cambios[alumnoActualHist];
                            // Si el cambio dice "A a F", tomamos "F"
                            const estadoFinal = cambio.includes(" a ") ? cambio.split(" a ").pop() : cambio;
                            
                            if (estadoFinal !== "A") {
                                registrosCompletosHist.push({
                                    fecha: data.fecha_asis,
                                    docente: data.profesor,
                                    estado: estadoFinal,
                                    timestamp: fechaAsis.getTime()
                                });
                                profesoresSet.add(data.profesor);
                            }
                        }
                    }
                });
            }

            // Ordenar por fecha descendente
            registrosCompletosHist.sort((a, b) => b.timestamp - a.timestamp);

            // Llenar combo de profesores
            const comboProfe = document.getElementById("filtroProfeHist");
            comboProfe.innerHTML = '<option value="TODOS">TODOS LOS PROFESORES</option>';
            Array.from(profesoresSet).sort().forEach(p => {
                const opt = document.createElement("option");
                opt.value = p; opt.textContent = p;
                comboProfe.appendChild(opt);
            });

            renderizarHistorialAlumno();
        } finally {
            document.getElementById("loading").classList.remove("active");
        }
    }

    window.renderizarHistorialAlumno = function() {
        const profeSel = document.getElementById("filtroProfeHist").value;
        const container = document.getElementById("historialAlumnoContenido");
        container.innerHTML = "";

        const filtrados = registrosCompletosHist.filter(r => 
            (filtroEstadoHist === null || r.estado === filtroEstadoHist) &&
            (profeSel === "TODOS" || r.docente === profeSel)
        );

        // Actualizar contadores globales (del set actual filtrado solo por profe)
        const baseParaConteo = registrosCompletosHist.filter(r => profeSel === "TODOS" || r.docente === profeSel);
        document.getElementById("countF").textContent = baseParaConteo.filter(r => r.estado === 'F').length;
        document.getElementById("countFA").textContent = baseParaConteo.filter(r => r.estado === 'FA').length;
        document.getElementById("countL").textContent = baseParaConteo.filter(r => r.estado === 'L').length;

        filtrados.forEach(r => {
            const div = document.createElement("div");
            div.style.cssText = "display: flex; align-items: center; padding: 8px 5px; border-bottom: 1px solid #eee; font-size: 11px;";
            const color = r.estado === 'F' ? '#d32f2f' : (r.estado === 'FA' ? '#00bcd4' : '#558b2f');
            const label = r.estado === 'FA' ? 'ATRA' : r.estado;

            div.innerHTML = `
                <span style="width: 85px;">${r.fecha}</span>
                <span style="flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 5px;">${r.docente}</span>
                <span style="width: 50px; text-align: center; color: white; background: ${color}; font-weight: 900; border-radius: 4px; padding: 2px;">${label}</span>
            `;
            container.appendChild(div);
        });

        if (filtrados.length === 0) {
            container.innerHTML = '<div style="text-align:center; padding: 20px; color: gray; font-size: 12px; font-weight: bold;">SIN REGISTROS PARA ESTA SELECCIÓN</div>';
        }
    }

  window.cerrarSesion = function() {

    localStorage.removeItem("profesor");

    window.location.href = "index.html";

};

    // INICIALIZAR
    cargarCursos();
</script>
